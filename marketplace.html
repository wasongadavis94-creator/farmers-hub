<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace | Farmers Hub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🌾 Farmers Hub</h1>
    <p>Buy and sell agricultural products</p>

    <nav>
        <a href="index.html">Home</a>
        <a href="register.html">Register</a>
        <a href="marketplace.html">Marketplace</a>
    </nav>
</header>

<main>

<section>
    <section>
    <h2>🛒 Farmers Marketplace</h2>

    <p>
        Find agricultural products directly from farmers.
    </p>

    <div id="marketplaceProducts" class="products">
        <p>Loading products...</p>
    </div>

<section>
    <h2>List Your Product</h2>

    <form id="productForm">

        <label>Product Name</label>
        <input type="text" id="productName"
               placeholder="e.g. Tomatoes" required>

        <label>Price</label>
        <input type="text" id="productPrice"
               placeholder="e.g. KSh 100 per kg" required>

        <label>Location</label>
        <input type="text" id="productLocation"
               placeholder="e.g. Meru County" required>

        <button type="submit">List Product</button>

    </form>

    <p id="productMessage"></p>
</section>

</main>

<footer>
    <p>&copy; 2026 Farmers Hub | Empowering Farmers, Growing Communities</p>
</footer>

<script>
<script>

    // Get saved products
    const products =
        JSON.parse(localStorage.getItem("products")) || [];

    const container =
        document.getElementById("marketplaceProducts");


    // Show products
    function displayProducts() {

        if (products.length === 0) {

            container.innerHTML = `
                <div class="product">
                    <h3>🌱 No Products Yet</h3>
                    <p>
                        Farmers have not listed any products yet.
                    </p>

                    <a href="dashboard.html">
                        <button>List Your Product</button>
                    </a>
                </div>
            `;

            return;
        }


        container.innerHTML = "";


        products.forEach(function(product) {

            const productDiv =
                document.createElement("div");

            productDiv.className = "product";

            productDiv.innerHTML = `
                <h3>🌱 ${product.name}</h3>

                <p>
                    <strong>Price:</strong>
                    ${product.price}
                </p>

                <p>
                    <strong>Location:</strong>
                    ${product.location}
                </p>

                <button onclick="contactFarmer('${product.name}')">
                    Contact Farmer
                </button>
            `;

            container.appendChild(productDiv);
        });
    }


    // Contact farmer
    function contactFarmer(productName) {

        alert(
            "You are interested in: " +
            productName +
            ". Farmer contact feature coming soon!"
        );
    }


    displayProducts();

</script>
</script>

</body>
</html>
