<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Registration | Farmers Hub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🌾 Farmers Hub</h1>
    <p>Join our farming community</p>

    <nav>
        <a href="index.html">Home</a>
        <a href="register.html">Register</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<main>

    <section class="registration">

        <h2>Farmer Registration</h2>

        <p>
            Create your Farmers Hub account to access agricultural
            information, markets and farming opportunities.
        </p>

        <form id="registrationForm">

            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="e.g. 0712345678" required>

            <label for="location">Location</label>
            <input type="text" id="location" placeholder="County / Sub-county" required>

            <label for="farming">Type of Farming</label>

            <select id="farming" required>
                <option value="">Select farming type</option>
                <option>Crop Farming</option>
                <option>Livestock Farming</option>
                <option>Poultry Farming</option>
                <option>Mixed Farming</option>
                <option>Horticulture</option>
                <option>Other</option>
            </select>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email">

            <button type="submit">Register as Farmer</button>

        </form>

        <p id="message"></p>

    </section>

</main>

<footer>
    <p>&copy; 2026 Farmers Hub | Empowering Farmers, Growing Communities</p>
</footer>

<script>
document.getElementById("registrationForm").addEventListener("submit", function(event) {

    event.preventDefault();

    document.getElementById("message").textContent =
        "Registration successful! Welcome to Farmers Hub.";

    document.getElementById("registrationForm").reset();
});
</script>

</body>
</html>
