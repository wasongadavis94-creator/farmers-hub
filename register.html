<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Registration | Farmers Hub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🌾 Farmers Hub</h1>
    <p>Join our farming community</p>

    <nav>
       <a href="index.html">Home</a>
<a href="marketplace.html">Marketplace</a>
<a href="dashboard.html">Dashboard</a>
    </nav>
</header>

<main>

    <section class="registration">

        <h2>Farmer Registration</h2>

        <p>
            Create your Farmers Hub account to access agricultural
            information, markets and farming opportunities.
        </p>

        <form id="registrationForm">

            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="e.g. 0712345678" required>

            <label for="location">Location</label>
            <input type="text" id="location" placeholder="County / Sub-county" required>

            <label for="farming">Type of Farming</label>

            <select id="farming" required>
                <option value="">Select farming type</option>
                <option>Crop Farming</option>
                <option>Livestock Farming</option>
                <option>Poultry Farming</option>
                <option>Mixed Farming</option>
                <option>Horticulture</option>
                <option>Other</option>
            </select>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email">

            <button type="submit">Register as Farmer</button>

        </form>

        <p id="message"></p>

    </section>

<script>
document.getElementById("registrationForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const farmer = {
        name: document.getElementById("name").value,
        phone: document.getElementById("phone").value,
        location: document.getElementById("location").value,
        farming: document.getElementById("farming").value,
        email: document.getElementById("email").value
    };

    // Save farmer information
    localStorage.setItem("farmer", JSON.stringify(farmer));

    document.getElementById("message").textContent =
        "✅ Registration successful! Your information has been saved.";

    // Clear the form
    document.getElementById("registrationForm").reset();

});
</script>
</script>

</body>
</html>
